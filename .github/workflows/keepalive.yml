# GitHub disables scheduled workflows in a repository with no activity for 60 days. That would
# silence the probe without any error. This commits a heartbeat on the 1st of each month, which
# counts as activity.
name: keepalive
on:
  schedule:
    - cron: "17 6 1 * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: commit a heartbeat
        run: |
          date -u +%Y-%m-%dT%H:%M:%SZ > .heartbeat
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add .heartbeat
          git commit -m "keepalive: monthly heartbeat"
          git push
